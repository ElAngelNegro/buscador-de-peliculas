<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Películas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🎬 Buscador de Películas</h1>

  <div class="buscador">
    <input type="text" id="input-buscar" placeholder="Busca una película...">
    <button id="btn-buscar">Buscar</button>
  </div>

  <div class="filtro">
      <input type="number" id="input-anio" placeholder="Filtrar por año (ej: 1999)" min="1900" max="2025">
      <button id="btn-filtrar">Filtrar</button>
      <button id="btn-limpiar">Limpiar filtro</button>
  </div>

  <h2>Resultados</h2>
  <p id="mensaje">Ingresa un título para buscar.</p>
  <div class="grid" id="resultados"></div>

  <h2>Favoritos</h2>
  <p id="mensaje-favs">No tienes favoritos aún.</p>
  <div class="grid" id="favoritos"></div>

  <!-- Modal detalle película -->
<div class="modal fade" id="modalPelicula" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content bg-dark text-white">

      <div class="modal-header border-secondary">
        <h5 class="modal-title" id="modal-titulo">Cargando...</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div class="row">
          <div class="col-md-4 text-center mb-3 mb-md-0">
            <img id="modal-poster" src="" alt="" class="img-fluid rounded shadow">
          </div>
          <div class="col-md-8">
            <p id="modal-anio" class="text-secondary mb-1"></p>

            <div class="mb-2">
              <span class="text-warning fw-bold fs-5" id="modal-rating">⭐ --</span>
              <div class="progress mt-1" style="height: 8px;">
                <div id="modal-barra" class="progress-bar bg-warning" style="width: 0%"></div>
              </div>
            </div>

            <div id="modal-generos" class="mb-3"></div>

            <table class="table table-dark table-sm mb-3">
              <tbody>
                <tr><th>Director</th><td id="modal-director">--</td></tr>
                <tr><th>Actores</th><td id="modal-actores">--</td></tr>
                <tr><th>País</th><td id="modal-pais">--</td></tr>
                <tr><th>Duración</th><td id="modal-duracion">--</td></tr>
                <tr><th>Taquilla</th><td id="modal-taquilla">--</td></tr>
              </tbody>
            </table>

            <h6 class="text-danger">Sinopsis</h6>
            <p id="modal-sinopsis" class="text-secondary"></p>
          </div>
        </div>
      </div>

      <div class="modal-footer border-secondary">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" class="btn btn-danger" id="modal-btn-favorito">+ Agregar a Favoritos</button>
      </div>

    </div>
  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>
</html>
